# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  redis_data:
    driver: local

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16