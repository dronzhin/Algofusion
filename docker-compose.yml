# docker-compose.yml
# Algofusion - система обработки документов с LLM
# Версия: 0.1.0

# ============================================================================
# СЕРВИСЫ
# ============================================================================
services:
  # --------------------------------------------------------------------------
  # REDIS - Брокер сообщений и кэш
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: algofusion-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    command: redis-server --appendonly yes --appendfsync everysec
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # UI - Streamlit интерфейс
  # --------------------------------------------------------------------------
  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    container_name: algofusion-ui
    ports:
      - "8501:8501"
    volumes:
      - ${HOST_SHARED_FILES_PATH:-./shared/files}:/shared/files:rw
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - SHARED_FILES_PATH=${SHARED_FILES_PATH:-/shared/files}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONPATH=/app
      - STREAMLIT_SERVER_PORT=${STREAMLIT_SERVER_PORT:-8501}
      - STREAMLIT_SERVER_ADDRESS=${STREAMLIT_SERVER_ADDRESS:-0.0.0.0}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      # Проверка доступности порта 8501 через Python (надёжнее curl)
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(5); s.connect(('localhost',8501)); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # FILE MONITOR - Мониторинг внешней папки
  # --------------------------------------------------------------------------
  file-monitor:
    build:
      context: .
      dockerfile: monitor/Dockerfile
    container_name: algofusion-file-monitor
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ${HOST_SHARED_FILES_PATH:-./shared/files}:/shared/files:rw
      - ${HOST_INCOMING_PATH:-/home/dmitry/incoming}:/external/incoming:rw
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - SHARED_FILES_PATH=${SHARED_FILES_PATH:-/shared/files}
      - EXTERNAL_MONITOR_PATH=${EXTERNAL_MONITOR_PATH:-/external/incoming}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONPATH=/app
      - MONITOR_INTERVAL=${MONITOR_INTERVAL:-5}
      - MONITOR_PATTERNS=${MONITOR_PATTERNS:-*.pdf,*.png,*.jpg}
      - CONTAINER_UID=${UID:-1000}
      - CONTAINER_GID=${GID:-1000}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # PREPROCESSOR - Предобработка изображений (конвертация, улучшение)
  # --------------------------------------------------------------------------
  processor:
    build:
      context: .
      dockerfile: workers/Preprocess/Dockerfile
    container_name: algofusion-processor
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ${HOST_SHARED_FILES_PATH:-./shared/files}:/shared/files:rw
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - SHARED_FILES_PATH=${SHARED_FILES_PATH:-/shared/files}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONPATH=/app
      - PROCESSOR_PDF_DPI=${PROCESSOR_PDF_DPI:-600}
      - PROCESSOR_BG_THRESHOLD=${PROCESSOR_BG_THRESHOLD:-128}
      - PROCESSOR_BIN_THRESHOLD=${PROCESSOR_BIN_THRESHOLD:-128}
      - PROCESSOR_MEDIAN_ITER=${PROCESSOR_MEDIAN_ITER:-5}
      - PROCESSOR_MEDIAN_SIZE=${PROCESSOR_MEDIAN_SIZE:-3}
      - PROCESSOR_ROT_ANGLE_THRESH=${PROCESSOR_ROT_ANGLE_THRESH:-0.5}
      - PROCESSOR_ROT_SCALE=${PROCESSOR_ROT_SCALE:-1.0}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "${PROCESSOR_CPU_LIMIT:-2}"
          memory: "${PROCESSOR_MEMORY_LIMIT:-2G}"
        reservations:
          cpus: "0.5"
          memory: "512M"

  # --------------------------------------------------------------------------
  # OCR - Распознавание текста (Tesseract)
  # --------------------------------------------------------------------------
  ocr:
    build:
      context: .
      dockerfile: workers/OCR/Dockerfile
    container_name: algofusion-ocr
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ${HOST_SHARED_FILES_PATH:-./shared/files}:/shared/files:rw
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - SHARED_FILES_PATH=${SHARED_FILES_PATH:-/shared/files}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONPATH=/app
      - OCR_DEFAULT_ENGINE=${OCR_ENGINE:-tesseract}
      - OCR_DEFAULT_LANG=${OCR_LANGS:-rus+eng}
      - OCR_TESSERACT_OEM=1
      - OCR_TESSERACT_PSM=11
      - OCR_TESSERACT_DPI=${OCR_DPI:-300}
      - OCR_EASYOCR_GPU=0
      - OCR_EASYOCR_MIN_SCORE=0.5
    depends_on:
      redis:
        condition: service_healthy
      processor:
        condition: service_started
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "${OCR_CPU_LIMIT:-2}"
          memory: "${OCR_MEMORY_LIMIT:-2G}"
        reservations:
          cpus: "0.5"
          memory: "512M"

  # --------------------------------------------------------------------------
  # 🆕 OLLAMA - LLM inference server (GPU/CPU авто-детект)
  # --------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: algofusion-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
      - ./workers/LLM/ollama_init:/ollama_init:ro
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_MAX_LOADED_MODELS=5
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_NUM_GPU=-1
      - OLLAMA_MODELS=qwen2.5:1.5b,qwen2.5:7b
    entrypoint: ["/ollama_init/entrypoint.sh"]
    networks:
      - app-network
    healthcheck:
      # 🔹 Используем CMD-SHELL для надёжности
      test: ["CMD-SHELL", "curl -fs http://localhost:11434 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 3000s  # 🔹 КРИТИЧНО: даём 50 минут на скачивание моделей
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: "16G"
        reservations:
          cpus: "1"
          memory: "4G"
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # --------------------------------------------------------------------------
  # 🆕 LLM Worker - Классификация и экстракция через Ollama
  # --------------------------------------------------------------------------
  llm:
    build:
      context: .
      dockerfile: workers/LLM/Dockerfile
    container_name: algofusion-llm
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ${HOST_SHARED_FILES_PATH:-./shared/files}:/shared/files:rw
      - ./workers/LLM/schemas:/app/workers/LLM/schemas:ro
    environment:
      # === Redis ===
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      # === Files ===
      - SHARED_FILES_PATH=${SHARED_FILES_PATH:-/shared/files}
      # === Logging ===
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONPATH=/app
      # === LLM / Ollama ===
      - LLM_ENDPOINT=${LLM_ENDPOINT:-http://ollama:11434}
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:7b}
      - LLM_CLASSIFIER_MODEL=${LLM_CLASSIFIER_MODEL:-qwen2.5:1.5b}
      - LLM_EXTRACTOR_MODEL=${LLM_EXTRACTOR_MODEL:-qwen2.5:7b}
      - LLM_TIMEOUT=120
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.1}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-4096}
      - LLM_JSON_MODE=${LLM_JSON_MODE:-true}
      # === Классификация ===
      - LLM_CLASSIFY_THRESHOLD=${LLM_CLASSIFY_THRESHOLD:-0.85}
      - LLM_PENDING_TIMEOUT_MIN=${LLM_PENDING_TIMEOUT_MIN:-30}
      - LLM_PENDING_RECHECK_SEC=${LLM_PENDING_RECHECK_SEC:-30}
      - LLM_MAX_PENDING_REQUEUES=${LLM_MAX_PENDING_REQUEUES:-20}
      # === Экстракция ===
      - LLM_SCHEMAS_PATH=${LLM_SCHEMAS_PATH:-/app/workers/LLM/schemas}
      - LLM_OUTPUT_FORMAT=${LLM_OUTPUT_FORMAT:-xml}
      # === Retry ===
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-3}
      - LLM_RETRY_DELAY=${LLM_RETRY_DELAY:-2.0}
      # === Документы ===
      - LLM_ALLOWED_DOC_TYPES=${LLM_ALLOWED_DOC_TYPES:-dogovor,schet,tovarnaya_nakladnaya,schet_protokol,unknown}
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy  # 🔹 Ждёт, пока ollama загрузит модели и станет healthy
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "${LLM_WORKER_CPU_LIMIT:-2}"
          memory: "${LLM_WORKER_MEMORY_LIMIT:-4G}"
        reservations:
          cpus: "1"
          memory: "1G"

# ============================================================================
# VOLUMES (именованные тома для постоянных данных)
# ============================================================================
volumes:
  redis_data:
    driver: local
    labels:
      - "com.algofusion.description=Redis persistent data"
  processor_work:
    driver: local
  ocr_work:
    driver: local
  ollama_models:
    driver: local
    labels:
      - "com.algofusion.description=Ollama models cache"

# ============================================================================
# NETWORKS (изолированная сеть для сервисов)
# ============================================================================
networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16