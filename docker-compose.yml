# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  redis_data:
    driver: local
  processor_work:
    driver: local
  ocr_work:
    driver: local

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16