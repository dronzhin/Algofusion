# docker-compose.yml

services:
  redis:
    image: redis:7-alpine
    container_name: algofusion-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    container_name: algofusion-ui
    ports:
      - "8501:8501"
    volumes:
      - ${HOST_SHARED_FILES_PATH:-./shared/files}:/shared/files:rw
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SHARED_FILES_PATH=/shared/files
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  file-monitor:
    build:
      context: .
      dockerfile: monitor/Dockerfile
    container_name: algofusion-file-monitor
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ${HOST_SHARED_FILES_PATH:-./shared/files}:/shared/files:rw
      - ${HOST_INCOMING_PATH:-/home/dmitry/incoming}:/external/incoming:rw
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SHARED_FILES_PATH=/shared/files
      - EXTERNAL_MONITOR_PATH=/external/incoming
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app
      - CONTAINER_UID=${UID:-1000}
      - CONTAINER_GID=${GID:-1000}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  worker-cleaner:
    build:
      context: ./workers/CLEANER
      dockerfile: Dockerfile
    container_name: algofusion-worker-cleaner
    volumes:
      - ${HOST_SHARED_FILES_PATH:-./shared/files}:/shared/files:rw
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CLEANER_QUEUE=files:cleaner
      - NEXT_QUEUE=files:layout
      - SHARED_FILES_DIR=/shared/files
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  worker-layout:
    build:
      context: ./workers/LAYOUT
      dockerfile: Dockerfile
    container_name: algofusion-worker-layout
    volumes:
      - ${HOST_SHARED_FILES_PATH:-./shared/files}:/shared/files:rw
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LAYOUT_QUEUE=files:layout
      - NEXT_QUEUE=files:ocr
      - SHARED_FILES_DIR=/shared/files
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  worker-ocr:
    build:
      context: ./workers/OCR
      dockerfile: Dockerfile
    container_name: algofusion-worker-ocr
    volumes:
      - ${HOST_SHARED_FILES_PATH:-./shared/files}:/shared/files:rw
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OCR_QUEUE=files:ocr
      - NEXT_QUEUE=files:parser
      - SHARED_FILES_DIR=/shared/files
      - OCR_ENGINE=surya
      - OCR_LANG=rus+eng
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  worker-parser:
    build:
      context: ./workers/PARSER
      dockerfile: Dockerfile
    container_name: algofusion-worker-parser
    volumes:
      - ${HOST_SHARED_FILES_PATH:-./shared/files}:/shared/files:rw
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PARSER_QUEUE=files:parser
      - NEXT_QUEUE=files:normalizer
      - SHARED_FILES_DIR=/shared/files
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  worker-normalizer:
    build:
      context: ./workers/NORMALIZER
      dockerfile: Dockerfile
    container_name: algofusion-worker-normalizer
    volumes:
      - ${HOST_SHARED_FILES_PATH:-./shared/files}:/shared/files:rw
    environment:
      - REDIS_URL=redis://redis:6379/0
      - NORMALIZER_QUEUE=files:normalizer
      - NEXT_QUEUE=files:reconcile
      - SHARED_FILES_DIR=/shared/files
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  worker-reconcile:
    build:
      context: ./workers/RECONCILE
      dockerfile: Dockerfile
    container_name: algofusion-worker-reconcile
    volumes:
      - ${HOST_SHARED_FILES_PATH:-./shared/files}:/shared/files:rw
    environment:
      - REDIS_URL=redis://redis:6379/0
      - RECONCILE_QUEUE=files:reconcile
      - NEXT_QUEUE=files:final_json
      - SHARED_FILES_DIR=/shared/files
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  worker-final-json:
    build:
      context: ./workers/FINAL_JSON
      dockerfile: Dockerfile
    container_name: algofusion-worker-final-json
    volumes:
      - ${HOST_SHARED_FILES_PATH:-./shared/files}:/shared/files:rw
    environment:
      - REDIS_URL=redis://redis:6379/0
      - FINAL_JSON_QUEUE=files:final_json
      - SHARED_FILES_DIR=/shared/files
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

volumes:
  redis_data:
    driver: local

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
