# docker-compose.yml

services:
  # ============================================================================
  # REDIS - Брокер сообщений и кэш
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: algofusion-redis
    ports:
      - "6379:6379"  # ← Для отладки, в продакшене убрать
    volumes:
      - redis_data:/data
    networks:
      - app-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ============================================================================
  # UI - Streamlit интерфейс
  # ============================================================================
  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    container_name: algofusion-ui
    ports:
      - "8501:8501"
    volumes:
      - ${HOST_SHARED_FILES_PATH:-./shared/files}:/shared/files:rw
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SHARED_FILES_PATH=/shared/files
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ============================================================================
  # FILE MONITOR - Мониторинг внешней папки
  # ============================================================================
  file-monitor:
    build:
      context: .
      dockerfile: monitor/Dockerfile
    container_name: algofusion-file-monitor

    # ← Запуск от имени текущего пользователя хоста
    user: "${UID:-1000}:${GID:-1000}"

    volumes:
      - ${HOST_SHARED_FILES_PATH:-./shared/files}:/shared/files:rw
      - ${HOST_INCOMING_PATH:-/home/dmitry/incoming}:/external/incoming:rw

    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SHARED_FILES_PATH=/shared/files
      - EXTERNAL_MONITOR_PATH=/external/incoming
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app
      - CONTAINER_UID=${UID:-1000}
      - CONTAINER_GID=${GID:-1000}

    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # ============================================================================
  # ============================================================================
  processor:
    build:
      context: .
      dockerfile: workers/Preprocess/Dockerfile
#      dockerfile: workers/preprocessing_stage_1/Dockerfile
    container_name: algofusion-processor
    restart: unless-stopped

    # ← Запуск от имени текущего пользователя (совместимо с file-monitor)
    user: "${UID:-1000}:${GID:-1000}"

    volumes:
      # Shared files для чтения оригиналов и записи результатов
      - ${HOST_SHARED_FILES_PATH:-./shared/files}:/shared/files:rw

    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SHARED_FILES_PATH=/shared/files
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app
      - PROCESSOR_PDF_DPI=600
      - PROCESSOR_BG_THRESHOLD=128
      - PROCESSOR_BIN_THRESHOLD=128
      - PROCESSOR_MEDIAN_ITER=5
      - PROCESSOR_MEDIAN_SIZE=3
      - PROCESSOR_ROT_ANGLE_THRESH=0.5
      - PROCESSOR_ROT_SCALE=1.0

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - app-network

    # Ограничение ресурсов (важно для обработки изображений)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ============================================================================
  # 🆕 OCR - Распознавание текста (автоматическое)
  # ============================================================================
  ocr:
    build:
      context: .
      dockerfile: workers/OCR/Dockerfile
    container_name: algofusion-ocr
    restart: unless-stopped

    user: "${UID:-1000}:${GID:-1000}"

    volumes:
      - ${HOST_SHARED_FILES_PATH:-./shared/files}:/shared/files:rw

    environment:
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Files
      - SHARED_FILES_PATH=/shared/files
      # Logging
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app
      # OCR settings
      - OCR_DEFAULT_ENGINE=tesseract
      - OCR_DEFAULT_LANG=rus+eng
      - OCR_TESSERACT_OEM=1
      - OCR_TESSERACT_PSM=11
      - OCR_TESSERACT_PREPROCESS=0
      - OCR_TESSERACT_DPI=300
      - OCR_EASYOCR_GPU=0
      - OCR_EASYOCR_MIN_SCORE=0.5

    depends_on:
      redis:
        condition: service_healthy
      processor:
        condition: service_started  # OCR зависит от результатов preprocess

    networks:
      - app-network

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

