# docker-compose.yml

services:
  # ============================================================================
  # REDIS - Брокер сообщений и кэш
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: algofusion-redis
    ports:
      - "6379:6379"  # ← Для отладки, в продакшене убрать
    volumes:
      - redis_data:/data
    networks:
      - app-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ============================================================================
  # UI - Streamlit интерфейс
  # ============================================================================
  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    container_name: algofusion-ui
    ports:
      - "8501:8501"
    volumes:
      - ${HOST_SHARED_FILES_PATH:-./shared/files}:/shared/files:rw
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SHARED_FILES_PATH=/shared/files
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ============================================================================
  # FILE MONITOR - Мониторинг внешней папки
  # ============================================================================
  file-monitor:
    build:
      context: .
      dockerfile: monitor/Dockerfile
    container_name: algofusion-file-monitor

    # ← Запуск от имени текущего пользователя хоста
    user: "${UID:-1000}:${GID:-1000}"

    volumes:
      - ${HOST_SHARED_FILES_PATH:-./shared/files}:/shared/files:rw
      - ${HOST_INCOMING_PATH:-/home/dmitry/incoming}:/external/incoming:rw

    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SHARED_FILES_PATH=/shared/files
      - EXTERNAL_MONITOR_PATH=/external/incoming
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app
      - CONTAINER_UID=${UID:-1000}
      - CONTAINER_GID=${GID:-1000}

    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

